version: '3.8'

services:
  order-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./config.json:/app/config.json:ro
      - ./.env:/app/.env:ro
      - ./scripts/.encryption_key:/app/scripts/.encryption_key:ro
    networks:
      - app-network

networks:
  app-network:
    external: true  # Assumes mysql8 is on a shared Docker network
