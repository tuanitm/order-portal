# Order Portal — Next.js app. MySQL is NOT part of this file: it runs in its
# own container, which joins this file's network ("order-network") and is
# reached by container name (default "mysql8") on its internal port 3306.
#
#   docker compose up -d --build            # build + start the portal (http://<server>:5005)
#   docker compose logs -f order-portal
#   docker compose --profile sync up -d     # also start the 03:00 SAP daily sync
#   docker compose run --rm daily-sync node scripts/daily-sync.mjs   # run a sync now
#
# Put the MySQL container on the network (once the portal is up, so the
# network exists):
#   docker network connect order-network <mysql-container-name>
# and make it permanent in MySQL's own compose file:
#   services: { mysql8: { networks: [order-network] } }
#   networks: { order-network: { external: true } }
# If its container name isn't "mysql8" (or it listens on another internal port),
# set MYSQL_HOST / MYSQL_PORT in the .env file next to this one.
#
# Secrets stay outside the image: config.json, .env and
# scripts/.encryption_key must exist next to this file on the server.

services:
  order-portal:
    build: .
    image: order-portal:latest
    container_name: order-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-5005}:5005"
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Override config.json's dbIp/dbPort (those are for local dev: the host
      # name + published port 3386). On the Docker network, use the MySQL
      # container's name and its internal port.
      MYSQL_HOST: ${MYSQL_HOST:-mysql8}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./.env:/app/.env:ro
      - ./scripts/.encryption_key:/app/scripts/.encryption_key:ro
    networks:
      - order-network

  # Optional: calls the portal's own admin sync endpoints every day at 03:00
  # (replaces the Windows scheduled task). Enable with `--profile sync`.
  daily-sync:
    image: order-portal:latest
    profiles: [ "sync" ]
    restart: unless-stopped
    user: root
    depends_on:
      order-portal:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORTAL_BASE_URL: http://order-portal:5005
    volumes:
      - ./config.json:/app/config.json:ro
      - ./.env:/app/.env:ro
      - ./scripts/.encryption_key:/app/scripts/.encryption_key:ro
    command:
      - sh
      - -c
      - >-
        echo '0 3 * * * cd /app && node scripts/daily-sync.mjs > /proc/1/fd/1 2>&1' > /etc/crontabs/root && exec crond -f -l 8
    networks:
      - order-network

networks:
  order-network:
    name: order-network
